# Shadowrocket 分流配置 v2 — 社区规则集版
# 生成时间: 2026-09-06 00:06 CST
# 变更: 取消内置基础广告拦截(REJECT); 直连/代理分流改用 Loyalsoldier 社区规则集
# 说明: PROXY = Shadowrocket 内置"代理"出口, 有订阅策略组可全局替换为你的组名
# 规则顺序: 局域网直连 → 社区国内直连集 → 社区被墙代理集 → 国内IP兜底 → 其余走代理

[Rule]
# ============ 1. 局域网 / 私有地址 直连 ============
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,100.64.0.0/10,DIRECT
IP-CIDR,169.254.0.0/16,DIRECT
IP-CIDR,224.0.0.0/4,DIRECT
IP-CIDR,::1/128,DIRECT
IP-CIDR,fc00::/7,DIRECT
IP-CIDR,fe80::/10,DIRECT

# ============ 2. 社区规则集: 国内直连 (Loyalsoldier/direct) ============
# 覆盖 QQ/微信/抖音/B站/各大国内站点, 无需手写
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt,DIRECT

# ============ 3. 社区规则集: 被墙网站走代理 (Loyalsoldier/proxy) ============
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt,PROXY

# ============ 4. 兜底: 国内 IP 直连 ============
GEOIP,CN,DIRECT

# ============ 5. 其余流量(国外/未知)走代理 ============
FINAL,PROXY

# --- 备注 ---
# 规则集源已测可用(HTTP 200); 当前用 GitHub raw 源(与你手机实测可达一致), 若失效可换 jsdelivr:
#   https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/direct.txt
#   https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/proxy.txt
# 首次使用需联网拉取一次, 之后本地缓存; 需要"去广告"时再单独加社区广告集即可
